; Seeed Studio XIAO ESP32-C5. Upload only to the XIAO.
; The RPLidar C1 is /dev/ttyUSB0. Do not point upload_port at it.
[env:seeed-xiao-esp32-c5]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
framework = arduino
board = seeed-xiao-esp32-c5
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
; The machine already has GCC 8 under this package name. The C5 core needs GCC 14.
platform_packages =
    platformio/toolchain-riscv32-esp@14.2.0+20251107
