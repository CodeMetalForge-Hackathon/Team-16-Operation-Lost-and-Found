; 2.4 GHz direction-finding beacon for the ESP32-S3 (USB Serial/JTAG board, 16 MB flash, 8 MB PSRAM).
; Build/flash:  pio run -t upload --upload-port COMx      Monitor:  pio device monitor -p COMx
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; ---- beacon settings (change and re-flash) ----
    -DBEACON_CHANNEL=11       ; fixed Wi-Fi channel 1..11 (legal for unlicensed use in the US and most countries)
    -DBEACON_RATE_HZ=50       ; Wi-Fi beacon frames per second
    -DBEACON_SSID=\"TEAM16-DF\"
    -DENABLE_BLE=1            ; also advertise over BLE so a phone app can find it
    -DBLE_NAME=\"TEAM16-DF\"
