; 2.4 GHz direction-finding beacon. Two boards supported:
;   esp32s3     ESP32-S3 USB Serial/JTAG board, 16 MB flash
;   esp32-pico  ESP32-PICO-D4 LoRa module behind a CH9102 USB-UART bridge, 4 MB flash
; Build/flash:  pio run -e esp32-pico -t upload --upload-port COM7     Monitor: pio device monitor -p COM7
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags =
    ; ---- beacon settings (change and re-flash) ----
    -DBEACON_CHANNEL=11
    -DBEACON_RATE_HZ=50
    -DBEACON_SSID=\"TEAM16-DF\"
    -DENABLE_BLE=1
    -DBLE_NAME=\"TEAM16-DF\"

[env:esp32s3]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; LilyGO LoRa32 915 MHz (ESP32-PICO-D4 + SX1276, "T3 V1.6.1" pinout). LoRa beacon is the main signal.
[env:esp32-pico]
board = pico32
board_build.partitions = huge_app.csv   ; Wi-Fi + BLE + LoRa will not fit the default 1.3 MB app slot
lib_deps = sandeepmistry/LoRa@^0.8.0
build_flags =
    ${env.build_flags}
    -DENABLE_LORA=1
    -DLORA_FREQ=915E6          ; US ISM 902-928 MHz. Use 868E6 (EU) or 433E6 for other board variants.
    -DLORA_SF=10               ; spreading factor 7..12: higher = longer range, slower packets
    -DLORA_BW=125E3
    -DLORA_TX_DBM=17           ; 2..20. Keep within your country's limit.
    -DLORA_INTERVAL_MS=1000
    -DLORA_SCK=5
    -DLORA_MISO=19
    -DLORA_MOSI=27
    -DLORA_CS=18
    -DLORA_RST=23
    -DLORA_DIO0=26

; Same board as a RECEIVER: prints RSSI/SNR of every beacon heard (flash this on a second board).
[env:esp32-pico-rx]
board = pico32
board_build.partitions = huge_app.csv   ; Wi-Fi + BLE + LoRa will not fit the default 1.3 MB app slot
lib_deps = sandeepmistry/LoRa@^0.8.0
build_flags =
    ${env:esp32-pico.build_flags}
    -DLORA_RX_MODE=1
