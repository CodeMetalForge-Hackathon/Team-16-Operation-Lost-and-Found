; MPU9250 IMU streamer for the Seeeduino v4.3 (ATmega328P, CP2102 USB serial). Hardware I2C (A4/A5, Grove I2C).
; Build/flash:  pio run -t upload --upload-port COM5        Monitor: pio device monitor -p COM5 -b 115200
[env:seeeduino]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps = testato/SoftwareWire@^1.6.0
build_flags =
    -DUSE_SOFT_I2C=0     ; sensor is on the hardware I2C pins (A4/A5, Grove I2C). Set 1 only if it is wired to A0/A1
    -DSAMPLE_HZ=100
